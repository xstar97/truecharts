image:
  pullPolicy: IfNotPresent
  repository: docker.io/reaparr/reaparr
  tag: 0.33.2@sha256:78d5eb1cf70b7bb94f09075c53a8b02ac5ad65432c58cd3b48190fedcfb465fc
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        protocol: http
        port: 7777
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            LOG_LEVEL: INFORMATION # Set the logging level in the docker logging
            LOG_ENV_VARS: false # Enable Log dump of all available ENV variables on Reaparr startup
            UNMASKED: false # Unmask sensitive data in logs if true
persistence:
  config:
    enabled: true
    mountPath: /Config
  downloads:
    enabled: true
    mountPath: /Downloads